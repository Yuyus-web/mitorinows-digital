<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>見取りのワークショップDigital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link class="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Yomogi&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            user-select: none;
        }
        .handwritten { font-family: 'Yomogi', 'Noto Sans JP', sans-serif; }
        .sticky-note {
            transition: box-shadow 0.2s ease, transform 0.1s ease;
            box-shadow: 4px 6px 12px rgba(0, 0, 0, 0.15);
            cursor: grab;
            touch-action: none;
        }
        .sticky-note:active {
            cursor: grabbing;
            transform: scale(1.02) rotate(0.5deg) !important;
            box-shadow: 12px 18px 24px rgba(0, 0, 0, 0.25);
            z-index: 100 !important;
        }
        .board-canvas {
            min-height: 650px;
            background-color: #ffffff;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            position: relative;
        }
        .pseudo-fullscreen-active {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important; z-index: 45 !important;
            background-color: #ffffff !important; border-radius: 0 !important; margin: 0 !important;
            overflow: hidden !important; overscroll-behavior: none !important; touch-action: none !important;
        }
        .menu-panel-active { opacity: 1 !important; transform: translateY(0) scale(1) !important; pointer-events: auto !important; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .prevent-pan { touch-action: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 起動時接続用ローディング画面 -->
    <div id="appLoader" class="fixed inset-0 bg-slate-50/95 z-[100000] flex flex-col items-center justify-center gap-4 p-4">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
        <p class="text-sm font-bold text-slate-700 handwritten animate-pulse">データベースへリアルタイム接続中...</p>
        <p class="text-[10px] text-slate-400">最初の接続には数秒かかる場合があります</p>
    </div>

    <!-- ホーム画面 -->
    <div id="homeScreen" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-10 border-b border-slate-200 pb-6">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 text-white p-3 rounded-2xl shadow-lg shadow-indigo-100">
                    <i class="fa-solid fa-cubes text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">見取りのワークショップDigital</h1>
                    <p class="text-xs text-slate-500 mt-1">子どもの事実・解釈・改善案を視覚的に整理するキャンバス</p>
                </div>
            </div>
            <button onclick="createNewWorkspace()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl text-sm font-bold flex items-center gap-2 transition shadow-md shadow-indigo-100">
                <i class="fa-solid fa-circle-plus text-base"></i><span>新規ワークスペース</span>
            </button>
        </div>
        <h2 class="text-lg font-bold text-slate-700 mb-6 flex items-center gap-2"><i class="fa-solid fa-folder-open text-indigo-500"></i><span>マイボード一覧</span></h2>
        <div id="workspaceGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
    </div>

    <!-- ボード画面 -->
    <div id="boardScreen" class="hidden flex-grow flex-col">
        <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <button onclick="goBackToHome()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 w-11 h-11 rounded-xl transition flex items-center justify-center"><i class="fa-solid fa-house text-base"></i></button>
                    <div class="flex items-center gap-2.5">
                        <h2 id="currentWorkspaceTitle" class="text-xl font-extrabold text-slate-800 tracking-tight truncate max-w-[150px] sm:max-w-[240px]"></h2>
                        <button onclick="renameCurrentWorkspace()" class="text-slate-400 hover:text-slate-600 p-1 rounded"><i class="fa-solid fa-pen text-xs"></i></button>
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <div id="currentWorkspaceDateContainer" class="hidden items-center gap-1.5 bg-slate-100 text-slate-600 px-3 py-2.5 rounded-xl text-xs font-semibold">
                        <i class="fa-regular fa-calendar-days text-slate-400"></i><span id="currentWorkspaceDate"></span>
                    </div>
                    <div class="relative flex items-center">
                        <input type="text" id="filterSearch" oninput="applyFilters()" placeholder="キーワード検索..." class="w-0 opacity-0 pointer-events-none transition-all duration-300 ease-in-out border border-transparent rounded-xl text-xs focus:outline-none bg-slate-50 mr-1 py-2.5">
                        <button onclick="toggleSearchInput()" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 w-11 h-11 rounded-xl flex items-center justify-center shadow-sm"><i class="fa-solid fa-magnifying-glass text-base"></i></button>
                    </div>
                    <div class="h-8 w-[1px] bg-slate-200 mx-1"></div>
                    
                    <div class="flex flex-col items-center">
                        <button onclick="openNoteModal('add', 'fact')" class="bg-sky-500 hover:bg-sky-600 text-white w-11 h-11 rounded-xl transition flex items-center justify-center shadow-md"><i class="fa-solid fa-plus text-lg"></i></button>
                        <span class="text-[9px] font-bold text-sky-700 mt-1">事実</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <button onclick="openNoteModal('add', 'interpretation')" class="bg-amber-500 hover:bg-amber-600 text-white w-11 h-11 rounded-xl transition flex items-center justify-center shadow-md"><i class="fa-solid fa-plus text-lg"></i></button>
                        <span class="text-[9px] font-bold text-amber-700 mt-1">解釈</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <button onclick="openNoteModal('add', 'improvement')" class="bg-emerald-500 hover:bg-emerald-600 text-white w-11 h-11 rounded-xl transition flex items-center justify-center shadow-md"><i class="fa-solid fa-plus text-lg"></i></button>
                        <span class="text-[9px] font-bold text-emerald-700 mt-1">改善案</span>
                    </div>

                    <div class="h-8 w-[1px] bg-slate-200 mx-1"></div>
                    <button onclick="alignStickyNotes()" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 w-11 h-11 rounded-xl flex items-center justify-center shadow-sm"><i class="fa-solid fa-table-cells-large text-base"></i></button>
                    <button onclick="toggleFullscreen()" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 w-11 h-11 rounded-xl flex items-center justify-center shadow-sm"><i class="fa-solid fa-expand text-base"></i></button>
                    <button onclick="exportBoardPDF()" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 w-11 h-11 rounded-xl flex items-center justify-center shadow-sm"><i class="fa-solid fa-file-pdf text-red-600 text-base"></i></button>
                    <button onclick="exportCSV()" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 w-11 h-11 rounded-xl flex items-center justify-center shadow-sm"><i class="fa-solid fa-file-csv text-emerald-600 text-base"></i></button>
                    <button onclick="openBackupModal()" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 w-11 h-11 rounded-xl flex items-center justify-center shadow-sm"><i class="fa-solid fa-database text-indigo-600 text-base"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 flex flex-col relative">
            <div id="boardContainer" class="board-canvas rounded-3xl border border-slate-200 shadow-inner overflow-hidden w-full flex-grow relative">
                <svg id="connectorSvg" class="absolute inset-0 pointer-events-none w-full h-full z-[1]"></svg>
                <canvas id="drawingCanvas" class="absolute inset-0 pointer-events-none w-full h-full z-[15]"></canvas>

                <!-- 手書きツールバー (お絵かきへのイベント干渉を停止) -->
                <div id="drawingToolbar" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" class="absolute bottom-4 left-4 z-[40] bg-white/95 backdrop-blur-sm border border-slate-200 rounded-2xl shadow-xl p-2.5 flex flex-col gap-3 opacity-90 hover:opacity-100">
                    <div class="flex flex-col gap-1.5 border-b border-slate-100 pb-2.5">
                        <button id="btn-mode-select" onclick="setDrawingMode('select')" class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 shadow-sm"><i class="fa-solid fa-arrow-pointer"></i></button>
                        <button id="btn-mode-pen" onclick="setDrawingMode('pen')" class="w-10 h-10 rounded-xl text-slate-400 hover:bg-slate-100"><i class="fa-solid fa-pen-nib"></i></button>
                        <button id="btn-mode-eraser" onclick="setDrawingMode('eraser')" class="w-10 h-10 rounded-xl text-slate-400 hover:bg-slate-100"><i class="fa-solid fa-eraser"></i></button>
                    </div>
                    <div id="drawingOptions" class="hidden flex-col gap-3">
                        <div class="flex flex-col gap-1.5 items-center border-b border-slate-100 pb-2.5" id="colorPaletteContainer">
                            <span class="text-[8px] font-bold text-slate-400">カラー</span>
                            <button onclick="setPenColor('#1e293b')" id="color-#1e293b" class="w-6 h-6 rounded-full bg-slate-800 border-2 border-indigo-600 scale-110 shadow-sm"></button>
                            <button onclick="setPenColor('#ef4444')" id="color-#ef4444" class="w-6 h-6 rounded-full bg-red-500 border-2 border-transparent hover:scale-105"></button>
                            <button onclick="setPenColor('#0ea5e9')" id="color-#0ea5e9" class="w-6 h-6 rounded-full bg-sky-500 border-2 border-transparent hover:scale-105"></button>
                            <button onclick="setPenColor('#10b981')" id="color-#10b981" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-transparent hover:scale-105"></button>
                        </div>
                        <div class="flex flex-col gap-1 items-center border-b border-slate-100 pb-2.5">
                            <span class="text-[8px] font-bold text-slate-400" id="width-tool-label">太さ</span>
                            <button onclick="setPenWidth(3)" id="width-3" class="w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-50 font-bold text-[10px]">細</button>
                            <button onclick="setPenWidth(6)" id="width-6" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-700 font-bold text-[10px]">中</button>
                            <button onclick="setPenWidth(12)" id="width-12" class="w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-50 font-bold text-[10px]">太</button>
                        </div>
                        <div class="flex flex-col gap-1">
                            <button onclick="undoLastStroke()" class="w-10 h-10 rounded-xl hover:bg-slate-100 text-slate-500"><i class="fa-solid fa-rotate-left"></i></button>
                            <button onclick="clearDrawingsWithConfirm()" class="w-10 h-10 rounded-xl hover:bg-red-50 text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 疑似全画面時 3点リーダーメニュー -->
                <div id="fullscreenMenu" class="hidden absolute top-4 right-4 z-[99999]">
                    <div class="relative group">
                        <button id="fullscreenMenuBtn" class="bg-slate-800 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center hover:bg-slate-700"><i class="fa-solid fa-ellipsis-vertical text-lg"></i></button>
                        <div id="fullscreenMenuPanel" class="absolute right-0 top-14 bg-white border border-slate-200 rounded-2xl shadow-2xl p-4 w-52 flex flex-col gap-2.5 transition-all duration-300 opacity-0 transform -translate-y-4 scale-95 pointer-events-none">
                            <h4 class="text-[10px] font-bold text-slate-400 border-b pb-1.5 mb-1">付箋を貼る</h4>
                            <button onclick="openNoteModal('add', 'fact')" class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold hover:bg-sky-50 text-sky-700"><i class="fa-solid fa-square-plus"></i>事実付箋を追加</button>
                            <button onclick="openNoteModal('add', 'interpretation')" class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold hover:bg-amber-50 text-amber-700"><i class="fa-solid fa-square-plus"></i>解釈付箋を追加</button>
                            <button onclick="openNoteModal('add', 'improvement')" class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold hover:bg-emerald-50 text-emerald-700"><i class="fa-solid fa-square-plus"></i>改善案付箋を追加</button>
                            <h4 class="text-[10px] font-bold text-slate-400 border-b pb-1.5 mt-1.5 mb-1">ボード操作</h4>
                            <button onclick="alignStickyNotes()" class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 text-slate-700"><i class="fa-solid fa-table-cells-large"></i>きれいに整列</button>
                            <button onclick="disableFullscreenAPI()" class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold hover:bg-red-50 text-red-600"><i class="fa-solid fa-compress"></i>全画面の終了</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 統合版：付箋 追加/編集 モーダル -->
    <div id="noteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl w-full max-w-md max-h-[calc(100vh-2rem)] shadow-2xl border border-slate-100 flex flex-col overflow-hidden">
            <div id="noteModalHeader" class="p-5 border-b flex justify-between items-center flex-shrink-0">
                <h3 id="noteModalTitle" class="text-base font-bold text-slate-800 flex items-center gap-2"></h3>
                <button onclick="closeNoteModal()" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleNoteSubmit(event)" class="flex flex-col flex-grow overflow-hidden m-0">
                <div class="p-6 space-y-4 overflow-y-auto scrollbar-none flex-grow">
                    <input type="hidden" id="noteModalMode">
                    <input type="hidden" id="noteModalRecordId">
                    <input type="hidden" id="noteModalType">
                    <!-- 不要な外枠(border)を削除し、すっきりとした余白に調整 -->
                    <div id="noteModalInputContainer" class="p-1">
                        <label id="noteModalInputLabel" class="block text-xs font-bold mb-1.5 transition-colors duration-200"></label>
                        <textarea id="noteText" required rows="4" class="w-full p-3.5 bg-white border border-slate-200 rounded-xl text-base sm:text-sm focus:ring-2 focus:outline-none transition-all duration-200 shadow-sm" placeholder="ここに入力してください..."></textarea>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-2.5 p-5 border-t border-slate-100 flex-shrink-0">
                    <button type="button" onclick="closeNoteModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-xs transition">キャンセル</button>
                    <button type="submit" id="noteModalSubmitBtn" class="text-white font-bold py-2.5 px-6 rounded-xl shadow-md transition text-xs"></button>
                </div>
            </form>
        </div>
    </div>

    <!-- 共通：ダイアログ（Prompt/Confirm） -->
    <div id="dialogModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-[99999] p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl border border-slate-100 flex flex-col overflow-hidden">
            <div id="dialogHeader" class="p-5 border-b border-slate-100 flex items-center gap-2.5">
                <div id="dialogIconBox" class="p-2 rounded-lg"><i id="dialogIcon" class="text-lg"></i></div>
                <h3 class="text-base font-bold text-slate-800" id="dialogTitle"></h3>
            </div>
            <div class="p-5 space-y-3 overflow-y-auto scrollbar-none flex-grow">
                <div id="dialogMessage" class="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed mb-1"></div>
                <div id="dialogInputArea" class="hidden flex-col gap-3">
                    <input type="text" id="dialogInput" class="w-full box-border px-3 py-2 border border-slate-200 rounded-xl text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" autocomplete="off">
                    <div id="dialogDateContainer" class="hidden">
                        <label class="text-xs text-slate-600 block mb-1">日付（実施日）：</label>
                        <input type="date" id="dialogDateInput" class="w-full box-border min-w-0 max-w-full px-3 py-2 border border-slate-200 rounded-xl text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white text-slate-800 appearance-none [-webkit-appearance:none]">
                    </div>
                </div>
            </div>
            <div class="p-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-2 flex-shrink-0">
                <button id="dialogCancelBtn" class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 font-bold px-4 py-2 rounded-xl text-xs transition">キャンセル</button>
                <button id="dialogOkBtn" class="text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-sm"></button>
            </div>
        </div>
    </div>

    <!-- バックアップモーダル -->
    <div id="backupModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[calc(100vh-2rem)] shadow-2xl border border-slate-100 flex flex-col overflow-hidden">
            <div class="p-5 border-b flex justify-between items-center bg-indigo-50/50 flex-shrink-0">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-database text-indigo-600"></i>データ移行</h3>
                <button onclick="closeBackupModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 space-y-4 text-xs overflow-y-auto scrollbar-none flex-grow">
                <p class="text-slate-500">復元を実行すると、現在のすべてのボードはバックアップの状態に上書きされます。</p>
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <h4 class="font-bold text-slate-700 mb-2 flex items-center gap-1.5"><i class="fa-solid fa-download text-indigo-500"></i>バックアップを保存</h4>
                    <button onclick="exportDataJSON()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-xl flex items-center gap-1.5"><i class="fa-solid fa-file-arrow-down"></i> 生成</button>
                </div>
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <h4 class="font-bold text-slate-700 mb-2 flex items-center gap-1.5 text-red-600"><i class="fa-solid fa-upload text-amber-500"></i>バックアップから復元</h4>
                    <div class="flex flex-col sm:flex-row gap-2 mt-2">
                        <input type="file" id="importFile" accept=".json" class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-amber-50 file:text-amber-700">
                        <button onclick="importDataJSON()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-3 py-1.5 rounded-lg flex-shrink-0">適用する</button>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-slate-50 border-t flex justify-end flex-shrink-0">
                <button onclick="closeBackupModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2 rounded-xl text-xs">閉じる</button>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-[999999] text-xs">
        <i id="toastIcon" class="fa-solid fa-circle-check text-indigo-400"></i><span id="toastMessage"></span>
    </div>

    <footer class="bg-white border-t border-slate-200 mt-auto py-5 text-center text-[10px] text-slate-400">
        <p>© 2026 見取りのワークショップDigital</p>
    </footer>

    <!-- Firebase リアルタイム同期 ＆ アプリケーション制御統合モジュール -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCutktS6-d59Fw5hwG0E--FBiVELyutT9k",
            authDomain: "mitorinows-digital.firebaseapp.com",
            projectId: "mitorinows-digital",
            storageBucket: "mitorinows-digital.firebasestorage.app",
            messagingSenderId: "375050113304",
            appId: "1:375050113304:web:fa0c2c595f357670174e6d",
            measurementId: "G-CY1Q823HGL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mitorinows-digital';

        // 厳密なコレクションパスの設計 (Rule 1)
        const workspacesCol = collection(db, 'artifacts', appId, 'public', 'data', 'workspaces');
        const recordsCol = collection(db, 'artifacts', appId, 'public', 'data', 'records');
        const drawingsCol = collection(db, 'artifacts', appId, 'public', 'data', 'drawings');

        // アプリケーション状態変数
        const STORAGE_KEY = "observation_workspace_v5_boards";
        const DISTANCE_3CM_PX = 114; 
        const DISTANCE_5CM_PX = 190; 

        const NOTE_THEMES = {
            fact: { bg: "bg-sky-50", border: "border-sky-100", noteBg: "bg-sky-100", noteBorder: "border-sky-300", text: "text-sky-950", tape: "from-sky-300 to-sky-200 border-sky-400", label: "事実", icon: '<i class="fa-solid fa-magnifying-glass"></i>', btn: "bg-sky-500 hover:bg-sky-600" },
            interpretation: { bg: "bg-amber-50", border: "border-amber-100", noteBg: "bg-amber-100", noteBorder: "border-amber-300", text: "text-amber-950", tape: "from-amber-300 to-amber-200 border-amber-400", label: "解釈", icon: '<i class="fa-solid fa-lightbulb"></i>', btn: "bg-amber-500 hover:bg-amber-600" },
            improvement: { bg: "bg-emerald-50", border: "border-emerald-100", noteBg: "bg-emerald-100", noteBorder: "border-emerald-300", text: "text-emerald-950", tape: "from-emerald-300 to-emerald-200 border-emerald-400", label: "改善案", icon: '<i class="fa-solid fa-seedling"></i>', btn: "bg-emerald-500 hover:bg-emerald-600" }
        };

        let boards = [];
        let allWorkspaces = [];
        let allRecords = [];
        let allDrawings = [];
        let localDrawings = []; // 通信遅延、切断、プレビュー時の手書きフリッカー対策用バッファ
        let user = null;
        let currentWorkspaceId = null;
        let draggedElement = null, dragOffsetX = 0, dragOffsetY = 0;
        let resizingElement = null, resizeStartWidth = 0, resizeStartHeight = 0, resizeStartX = 0, resizeStartY = 0;
        let tempConnectionFactId = null, tempConnectionInterpId = null, tempConnectionImproveId = null;
        
        // ドラッグセッション中の一時引き剥がし管理フラグ
        let isDraggedInterpDisconnected = false;
        let isDraggedImproveDisconnected = false;

        let dCanvas = null, dCtx = null, isDrawing = false, opMode = 'select', penColor = '#1e293b', penWidth = 6;
        let currentStrokePoints = [], lastEraserCoords = null;
        let menuDelayTimer = null;

        // --- Core Utility Functions ---
        function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;' }[m])); }

        // トースト通知
        function showToast(message, type = "success") {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");

            toastMsg.innerText = message;
            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-indigo-400";
            } else if (type === "info") {
                toastIcon.className = "fa-solid fa-circle-info text-sky-400";
            } else {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-red-400";
            }

            toast.classList.remove("translate-y-20", "opacity-0");
            toast.classList.add("translate-y-0", "opacity-100");

            setTimeout(() => {
                toast.classList.remove("translate-y-0", "opacity-100");
                toast.classList.add("translate-y-20", "opacity-0");
            }, 3000);
        }

        // --- Firebase Auth & Synced Listeners ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                // 初心者向けの完璧なエラーハンドリング
                const loader = document.getElementById("appLoader");
                if (loader) {
                    loader.innerHTML = `
                        <div class="bg-red-50 text-red-700 p-6 rounded-3xl max-w-md text-center shadow-2xl border border-red-200 animate-fade-in handwritten">
                            <i class="fa-solid fa-triangle-exclamation text-4xl mb-4 text-red-600 animate-bounce"></i>
                            <h3 class="font-extrabold text-base mb-2">Firebase接続エラー</h3>
                            <p class="text-xs leading-relaxed mb-4 text-left">
                                原因: Firebaseプロジェクト側で「匿名サインイン」が有効化されていません。<br><br>
                                <strong>【今すぐ直す手順】</strong><br>
                                1. Firebaseコンソール（左メニュー）の <strong>Authentication</strong> を開く<br>
                                2. 「Sign-in method」タブ内の <strong>「匿名（Anonymous）」</strong> を選択する<br>
                                3. 有効（Enabled）に切り替えて <strong>保存</strong> ボタンを押す<br>
                                4. 保存後、このページを再読み込みしてください。
                            </p>
                            <button onclick="window.location.reload()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2.5 px-6 rounded-xl transition shadow-md shadow-red-200">設定したので再読み込みする</button>
                        </div>
                    `;
                }
                showToast("Firebase接続に失敗しました。設定を確認してください。", "error");
            }
        };

        onAuthStateChanged(auth, (currentUser) => {
            user = currentUser;
            if (user) {
                // 接続完了時にローディング画面をフェードアウト
                const loader = document.getElementById("appLoader");
                if (loader) loader.classList.add("hidden");
                setupRealtimeListeners();
            }
        });

        initAuth();

        // --- Core Realtime Listeners ---
        function setupRealtimeListeners() {
            if (!user) return;

            // 共通エラーハンドラ
            const handleSyncError = (label) => (err) => {
                console.error("[" + label + " sync] error:", err);
                if (err && err.code === 'permission-denied') {
                    // ルール未設定の警告は一度だけ画面にデカデカと出す
                    if (!document.getElementById("ruleWarningBanner")) {
                        const banner = document.createElement("div");
                        banner.id = "ruleWarningBanner";
                        banner.className = "fixed top-0 left-0 right-0 z-[99998] bg-red-600 text-white text-xs px-4 py-3 shadow-lg flex items-center justify-between gap-3";
                        banner.innerHTML = '<div class="flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation animate-pulse"></i><span><strong>Firestoreルール未設定です</strong>: Firebaseコンソール → Firestore Database → ルール で公開してください。設定後ページを再読み込み。</span></div><button onclick="this.parentNode.remove()" class="bg-red-700 hover:bg-red-800 px-3 py-1 rounded text-[10px]">閉じる</button>';
                        document.body.appendChild(banner);
                    }
                    showToast(label + "の同期失敗（権限エラー）", "error");
                } else {
                    showToast(label + "同期エラー: " + (err.message || err), "error");
                }
            };

            // 1. ワークスペース（授業ボード）の同期
            onSnapshot(workspacesCol, (snapshot) => {
                allWorkspaces = [];
                snapshot.forEach(doc => { allWorkspaces.push({ id: doc.id, ...doc.data() }); });
                allWorkspaces.sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
                
                if (!currentWorkspaceId) {
                    renderHomeScreen();
                } else {
                    const current = allWorkspaces.find(w => w.id === currentWorkspaceId);
                    if (current) {
                        document.getElementById("currentWorkspaceTitle").innerText = current.name;
                        const dc = document.getElementById("currentWorkspaceDateContainer"), ds = document.getElementById("currentWorkspaceDate");
                        if (current.date) {
                            ds.innerText = new Date(current.date).toLocaleDateString("ja-JP") + " 実施";
                            dc.classList.replace("hidden", "flex");
                        } else {
                            dc.classList.replace("flex", "hidden");
                        }
                    } else {
                        goBackToHome();
                        showToast("ワークスペースが他の教師によって削除されました。", "info");
                    }
                }
            }, handleSyncError("ボード"));

            // 2. 付箋データの同期
            onSnapshot(recordsCol, (snapshot) => {
                allRecords = [];
                snapshot.forEach(doc => { allRecords.push({ id: doc.id, ...doc.data() }); });
                if (currentWorkspaceId) {
                    renderBoards();
                }
            }, handleSyncError("付箋"));

            // 3. 手書き描画の同期
            onSnapshot(drawingsCol, (snapshot) => {
                allDrawings = [];
                snapshot.forEach(doc => { allDrawings.push({ id: doc.id, ...doc.data() }); });
                
                // Firestoreからの同期時に、すでに反映済みのローカルバッファをパージする
                localDrawings = localDrawings.filter(ld => !allDrawings.some(ad => ad.id === ld.id));
                
                if (currentWorkspaceId) {
                    redrawDrawings();
                }
            }, handleSyncError("手書き描画"));
        }

        function loadAllData() {
            try { boards = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { boards = []; }
            boards.forEach(b => b.drawings = b.drawings || []);
        }

        function saveDataNoRender() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(boards));
        }

        function saveAllData() {
            saveDataNoRender();
            if (currentWorkspaceId) {
                drawConnections();
                redrawDrawings();
            }
        }

        // --- Board & Workspace Operations ---
        function createNewWorkspace() {
            if (!user) {
                showToast("データベースへの接続を待っています。しばらくお待ちください...", "info");
                return;
            }
            openDialog({ type: 'prompt', title: '作成', message: 'タイトルを入力：', showDate: true }).then(async (res) => {
                if (!res || !res.name) return;
                const newId = "board-" + Date.now();
                try {
                    await setDoc(doc(workspacesCol, newId), { name: res.name, date: res.date || "", createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
                    showToast("ワークスペースを作成しました");
                } catch (err) {
                    console.error("[createNewWorkspace] failed:", err);
                    if (err && err.code === 'permission-denied') {
                        showToast("Firestoreルール未設定のため保存できません。セキュリティルールを公開してください。", "error");
                    } else {
                        showToast("保存に失敗しました: " + (err.message || err), "error");
                    }
                }
            });
        }

        function renameWorkspace(id, e) {
            if (!user) return; e.stopPropagation();
            const b = allWorkspaces.find(x => x.id === id); if (!b) return;
            openDialog({ type: 'prompt', title: '名前変更', message: '新しい名称：', default: b.name }).then(async (res) => {
                if (res) {
                    await updateDoc(doc(workspacesCol, id), { name: res, updatedAt: new Date().toISOString() });
                    showToast("変更しました");
                }
            });
        }

        // --- UI bindings helper with sync context ---
        function renameCurrentWorkspace() {
            if (!user || !currentWorkspaceId) return;
            const b = allWorkspaces.find(x => x.id === currentWorkspaceId); if (!b) return;
            openDialog({ type: 'prompt', title: '名前変更', message: '名称変更：', default: b.name }).then(async (res) => {
                if (res) {
                    await updateDoc(doc(workspacesCol, currentWorkspaceId), { name: res, updatedAt: new Date().toISOString() });
                    showToast("ワークスペース名を変更しました");
                }
            });
        }

        function deleteWorkspace(id, e) {
            if (!user) return; e.stopPropagation();
            const b = allWorkspaces.find(x => x.id === id); if (!b) return;
            openDialog({ type: 'confirm', title: '実行確認', message: `「${b.name}」を削除しますか？\n（付箋データ等もすべて消去されます）`, danger: true }).then(async (confirmed) => {
                if (confirmed) {
                    await deleteDoc(doc(workspacesCol, id));
                    const batch = writeBatch(db);
                    allRecords.filter(r => r.workspaceId === id).forEach(r => batch.delete(doc(recordsCol, r.id)));
                    allDrawings.filter(d => d.workspaceId === id).forEach(d => batch.delete(doc(drawingsCol, d.id)));
                    await batch.commit();
                    showToast("削除しました");
                }
            });
        }

        function openBoard(id) {
            currentWorkspaceId = id;
            const b = allWorkspaces.find(x => x.id === id); if (!b) return;
            document.getElementById("currentWorkspaceTitle").innerText = b.name;
            const dc = document.getElementById("currentWorkspaceDateContainer"), ds = document.getElementById("currentWorkspaceDate");
            if (b.date) { ds.innerText = new Date(b.date).toLocaleDateString("ja-JP") + " 実施"; dc.classList.replace("hidden", "flex"); } else { dc.classList.replace("flex", "hidden"); }
            
            const search = document.getElementById("filterSearch"); search.value = "";
            search.className = "w-0 opacity-0 pointer-events-none transition-all duration-300 ease-in-out border border-transparent rounded-xl text-xs focus:outline-none bg-slate-50 mr-1 py-2.5";
            
            setDrawingMode('select');
            document.getElementById("homeScreen").classList.add("hidden");
            document.getElementById("boardScreen").classList.replace("hidden", "flex");
            
            // DOMの描画とコンテナのサイズがブラウザ側で確定するのを
            // 確実に待ってからCanvasとお絵かき関係を初期化する
            setTimeout(() => {
                initDrawingCanvas(); 
                renderBoards();
            }, 60);
        }

        function goBackToHome() {
            currentWorkspaceId = null;
            document.getElementById("boardScreen").classList.replace("flex", "hidden");
            document.getElementById("homeScreen").classList.remove("hidden");
            renderHomeScreen();
        }

        // --- Note Modal Operations ---
        function openNoteModal(mode, type, recordId = null) {
            document.getElementById("noteModalMode").value = mode;
            document.getElementById("noteModalType").value = type;
            document.getElementById("noteModalRecordId").value = recordId || "";
            const t = NOTE_THEMES[type], textEl = document.getElementById("noteText");
            
            if (mode === 'add') {
                textEl.value = "";
                document.getElementById("noteModalTitle").innerHTML = `${t.icon} 付箋を追加`;
                document.getElementById("noteModalSubmitBtn").innerHTML = '<i class="fa-solid fa-circle-plus"></i> ボードに貼る';
            } else {
                const r = allRecords.find(x => x.id === recordId);
                textEl.value = r ? r.text : "";
                document.getElementById("noteModalTitle").innerHTML = `${t.icon} 記録の編集`;
                document.getElementById("noteModalSubmitBtn").innerHTML = '変更を保存';
            }

            // ヘッダーおよび保存ボタンのクラスを付箋の種別に応じて切り替える
            document.getElementById("noteModalHeader").className = `p-5 border-b flex justify-between items-center flex-shrink-0 ${t.bg} ${t.border}`;
            document.getElementById("noteModalSubmitBtn").className = `${t.btn} text-white font-bold py-2.5 px-6 rounded-xl shadow-md transition flex items-center gap-2 text-xs`;
            
            const labelEl = document.getElementById("noteModalInputLabel");
            const noteTextEl = document.getElementById("noteText");

            labelEl.innerHTML = `${t.icon} ${t.label}の内容`;

            // 既存のカラークラスをきれいにリセットした上で再構築する
            labelEl.className = "block text-xs font-bold mb-1.5 transition-colors duration-200";
            noteTextEl.className = "w-full p-3.5 bg-white border border-slate-200 rounded-xl text-base sm:text-sm focus:ring-2 focus:outline-none transition-all duration-200 shadow-sm";

            // 「事実」「解釈」「改善案」それぞれのポップアップに完璧なテーマカラーのフォーカスリングとラベルカラーを適応
            if (type === 'fact') {
                labelEl.classList.add("text-sky-600");
                noteTextEl.classList.add("focus:ring-sky-400", "focus:border-sky-400");
            } else if (type === 'interpretation') {
                labelEl.classList.add("text-amber-600");
                noteTextEl.classList.add("focus:ring-amber-400", "focus:border-amber-400");
            } else if (type === 'improvement') {
                labelEl.classList.add("text-emerald-600");
                noteTextEl.classList.add("focus:ring-emerald-400", "focus:border-emerald-400");
            }

            document.getElementById("noteModal").classList.replace("hidden", "flex");
        }

        function closeNoteModal() { document.getElementById("noteModal").classList.replace("flex", "hidden"); }

        async function handleNoteSubmit(e) {
            e.preventDefault();
            if (!user || !currentWorkspaceId) return;

            const mode = document.getElementById("noteModalMode").value;
            const type = document.getElementById("noteModalType").value;
            const text = document.getElementById("noteText").value.trim();
            const recordId = document.getElementById("noteModalRecordId").value;

            if (!text) return showToast("入力してください", "error");

            try {
                if (mode === 'add') {
                    const newRecordId = "rec-" + Date.now();
                    // 新規付箋サイズを1.2倍に (113 x 97)
                    await setDoc(doc(recordsCol, newRecordId), {
                        workspaceId: currentWorkspaceId,
                        type, text, x: 20 + Math.random() * 25, y: 18 + Math.random() * 25, w: 113, h: 97,
                        connectedFactId: null, connectedInterpId: null, createdAt: new Date().toISOString()
                    });
                    showToast("追加しました");
                } else {
                    await updateDoc(doc(recordsCol, recordId), { text });
                    showToast("変更を保存しました");
                }
                await updateDoc(doc(workspacesCol, currentWorkspaceId), { updatedAt: new Date().toISOString() });
                closeNoteModal();
            } catch (err) {
                showToast("通信エラーが発生しました", "error");
            }
        }

        async function deleteRecordWithConfirm(id) {
            if (!user || !currentWorkspaceId) return;
            const confirmed = await openDialog({ type: 'confirm', title: '確認', message: 'この付箋を削除しますか？', danger: true });
            if (confirmed) {
                try {
                    const batch = writeBatch(db);
                    allRecords.forEach(r => {
                        if (r.workspaceId === currentWorkspaceId) {
                            if (r.connectedFactId === id) batch.update(doc(recordsCol, r.id), { connectedFactId: null });
                            if (r.connectedInterpId === id) batch.update(doc(recordsCol, r.id), { connectedInterpId: null });
                        }
                    });
                    batch.delete(doc(recordsCol, id));
                    await batch.commit();
                    await updateDoc(doc(workspacesCol, currentWorkspaceId), { updatedAt: new Date().toISOString() });
                    showToast("削除しました");
                } catch (err) {
                    showToast("削除に失敗しました", "error");
                }
            }
        }

        async function disconnectRecordDirectly(id, e) {
            if (!user || !currentWorkspaceId) return; e.stopPropagation();
            const r = allRecords.find(x => x.id === id); if (!r) return;
            try {
                const updates = {};
                if (r.type === "interpretation" && r.connectedFactId) updates.connectedFactId = null;
                if (r.type === "improvement" && r.connectedInterpId) updates.connectedInterpId = null;
                await updateDoc(doc(recordsCol, id), updates);
                await updateDoc(doc(workspacesCol, currentWorkspaceId), { updatedAt: new Date().toISOString() });
                showToast("つながりを解除しました", "info");
            } catch (err) {
                showToast("解除できませんでした", "error");
            }
        }

        // --- Render UI Boards ---
        function renderHomeScreen() {
            const g = document.getElementById("workspaceGrid"); g.innerHTML = "";
            if (!allWorkspaces.length) { g.innerHTML = `<div class="col-span-full py-20 flex flex-col items-center justify-center text-slate-400 bg-white rounded-3xl border border-dashed"><i class="fa-solid fa-shapes text-5xl mb-4 opacity-40"></i><p class="text-sm font-semibold">ワークスペースがありません</p></div>`; return; }
            allWorkspaces.forEach(b => {
                const dt = b.date ? (new Date(b.date).toLocaleDateString("ja-JP") + " 実施") : (new Date(b.updatedAt).toLocaleDateString("ja-JP", {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"}) + " 更新");
                const f = allRecords.filter(r=>r.workspaceId===b.id && r.type==='fact').length;
                const i = allRecords.filter(r=>r.workspaceId===b.id && r.type==='interpretation').length;
                const imp = allRecords.filter(r=>r.workspaceId===b.id && r.type==='improvement').length;
                g.innerHTML += `
                    <div class="bg-white border rounded-2xl p-4 shadow-sm hover:shadow-md transition relative group flex flex-col justify-between min-h-[114px]">

                        <div class="mt-4 border-t pt-2 flex justify-between">
                            <div class="flex gap-1 flex-wrap"><span class="bg-sky-100 text-sky-700 px-1.5 py-0.5 rounded-full text-[9px] font-bold">事実 ${f}</span><span class="bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full text-[9px] font-bold">解釈 ${i}</span><span class="bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-full text-[9px] font-bold">改善 ${imp}</span></div>
                            <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition"><button onclick="renameWorkspace('${b.id}', event)" class="text-slate-400 hover:text-slate-600 w-6 h-6 rounded hover:bg-slate-100"><i class="fa-solid fa-pen text-[9px]"></i></button><button onclick="deleteWorkspace('${b.id}', event)" class="text-slate-400 hover:text-red-500 w-6 h-6 rounded hover:bg-red-50"><i class="fa-solid fa-trash-can text-[9px]"></i></button></div>
                        </div>
                    </div>`;
            });
        }

        function renderBoards() {
            const b = document.getElementById("boardContainer"); if (!b || !currentWorkspaceId) return;
            b.querySelectorAll('.sticky-note, .empty-message').forEach(n => n.remove());
            const filter = document.getElementById("filterSearch").value.trim().toLowerCase();
            
            const recs = allRecords.filter(r => r.workspaceId === currentWorkspaceId && (!filter || r.text.toLowerCase().includes(filter)));
            
            // 既存DOMを一切破壊しないように、 document.createElement + appendChild で追加するよう再構築
            if (!recs.length) { 
                const emptyMsg = document.createElement("div");
                emptyMsg.className = "empty-message absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-xs pointer-events-none z-10";
                emptyMsg.innerHTML = `<i class="fa-solid fa-note-sticky text-4xl mb-3 opacity-30"></i><span>記録がありません</span>`;
                b.appendChild(emptyMsg);
                document.getElementById("connectorSvg").innerHTML = ""; 
                return; 
            }
            
            recs.forEach((r, i) => {
                if (r.x === undefined) { r.x = 10 + (i * 8) % 55; r.y = 12 + (i * 10) % 45; }
                const t = NOTE_THEMES[r.type], hasConn = (r.type === "interpretation" && r.connectedFactId) || (r.type === "improvement" && r.connectedInterpId);
                const card = document.createElement("div"); card.id = `note-${r.id}`;
                card.className = `sticky-note absolute rounded-2xl border flex flex-col ${t.noteBg} ${t.noteBorder} ${t.text}`;
                card.style.left = `${r.x}%`; card.style.top = `${r.y}%`; 
                // 標準付箋サイズを1.2倍化 (113 x 97)
                card.style.width = `${r.w || 113}px`; card.style.height = `${r.h || 97}px`; card.style.zIndex = "10";
                card.onmousedown = (e) => startDrag(e, card.id); card.ontouchstart = (e) => startDrag(e, card.id);
                card.innerHTML = `

        function adjustNoteFontSize(el) {

        // --- Interaction Snapping & Drag ---
        function checkStickySnapping(draggedRec) {
            const workspaceRecords = allRecords.filter(r => r.workspaceId === currentWorkspaceId);
            
            // 1. 既存の結合からの「引き剥がし（距離190px以上）」判定
            if (draggedRec.type === "improvement" && draggedRec.connectedInterpId) {
                const targetInterp = workspaceRecords.find(x => x.id === draggedRec.connectedInterpId);
                if (targetInterp) {
                    const dist = calculateEdgeDist(draggedRec, targetInterp);
                    if (dist >= DISTANCE_5CM_PX) {
                        isDraggedImproveDisconnected = true;
                    } else if (dist < DISTANCE_3CM_PX) {
                        isDraggedImproveDisconnected = false; // 再接近したら切断をキャンセル
                    }
                }
            }
            
            if (draggedRec.type === "interpretation" && draggedRec.connectedFactId) {
                const targetFact = workspaceRecords.find(x => x.id === draggedRec.connectedFactId);
                if (targetFact) {
                    const dist = calculateEdgeDist(draggedRec, targetFact);
                    if (dist >= DISTANCE_5CM_PX) {
                        isDraggedInterpDisconnected = true;
                    } else if (dist < DISTANCE_3CM_PX) {
                        isDraggedInterpDisconnected = false;
                    }
                }
            }

            tempConnectionFactId = null;
            tempConnectionInterpId = null;
            tempConnectionImproveId = null;

            // 2. 他の付箋への「新規吸着（距離114px以内）」判定
            if (draggedRec.type === "improvement") {
                if (!draggedRec.connectedInterpId || isDraggedImproveDisconnected) {
                    let nearest = null, minDist = Infinity;
                    workspaceRecords.forEach(o => {
                        if (o.type === "interpretation") {
                            const d = calculateEdgeDist(draggedRec, o);
                            if (d < minDist) { minDist = d; nearest = o; }
                        }
                    });
                    if (nearest && minDist < DISTANCE_3CM_PX) {
                        tempConnectionInterpId = nearest.id;
                    }
                }
            }

            if (draggedRec.type === "interpretation") {
                if (!draggedRec.connectedFactId || isDraggedInterpDisconnected) {
                    let nearestFact = null, minDistFact = Infinity;
                    workspaceRecords.forEach(o => {
                        if (o.type === "fact") {
                            const d = calculateEdgeDist(draggedRec, o);
                            if (d < minDistFact) { minDistFact = d; nearestFact = o; }
                        }
                    });
                    if (nearestFact && minDistFact < DISTANCE_3CM_PX) {
                        tempConnectionFactId = nearestFact.id;
                    }
                }
                
                let nearestImp = null, minDistImp = Infinity;
                workspaceRecords.forEach(o => {
                    if (o.type === "improvement") {
                        const isConnectedToMe = o.connectedInterpId === draggedRec.id;
                        const canSnap = !o.connectedInterpId || (isConnectedToMe && isDraggedImproveDisconnected);
                        if (canSnap) {
                            const d = calculateEdgeDist(draggedRec, o);
                            if (d < minDistImp) { minDistImp = d; nearestImp = o; }
                        }
                    }
                });
                if (nearestImp && minDistImp < DISTANCE_3CM_PX) {
                    tempConnectionImproveId = nearestImp.id;
                }
            }
        }

        function calculateEdgeDist(recA, recB) {
            const A = document.getElementById(`note-${recA.id}`), B = document.getElementById(`note-${recB.id}`); if (!A || !B) return Infinity;
            const rA = A.getBoundingClientRect(), rB = B.getBoundingClientRect();
            const w = Math.min(rA.right, rB.right) - Math.max(rA.left, rB.left), h = Math.min(rA.bottom, rB.bottom) - Math.max(rA.top, rB.top);
            if (w >= 0 && h >= 0) return 0; return w >= 0 ? -h : h >= 0 ? -w : Math.sqrt(w * w + h * h);
        }

        function setupGlobalDragListeners() {
            const move = (e) => {
                if (resizingElement) {
                    const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX, cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    let nw = resizeStartWidth + (cx - resizeStartX), nh = resizeStartHeight + (cy - resizeStartY);
                    if (nw < 55) nw = 55; if (nh < 45) nh = 45;
                    const bR = document.getElementById("boardContainer").getBoundingClientRect(); if (nw > bR.width) nw = bR.width; if (nh > bR.height) nh = bR.height;
                    resizingElement.style.width = `${nw}px`; resizingElement.style.height = `${nh}px`; adjustNoteFontSize(resizingElement); drawConnections(); e.preventDefault(); return;
                }
                if (draggedElement) {
                    const bR = document.getElementById("boardContainer").getBoundingClientRect(), cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX, cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    let nl = cx - bR.left - dragOffsetX, nt = cy - bR.top - dragOffsetY;
                    if (nl < 0) nl = 0; if (nt < 0) nt = 0;
                    if (nl > bR.width - draggedElement.offsetWidth) nl = bR.width - draggedElement.offsetWidth; if (nt > bR.height - draggedElement.offsetHeight) nt = bR.height - draggedElement.offsetHeight;
                    draggedElement.style.left = `${(nl / bR.width) * 100}%`; draggedElement.style.top = `${(nt / bR.height) * 100}%`;
                    
                    const r = allRecords.find(x => x.id === draggedElement.id.replace('note-', ''));
                    if (r) checkStickySnapping(r);
                    drawConnections(); e.preventDefault();
                }
            };
            const end = async () => {
                if (resizingElement) {
                    const rId = resizingElement.id.replace('note-', '');
                    await updateDoc(doc(recordsCol, rId), { w: resizingElement.offsetWidth, h: resizingElement.offsetHeight });
                    resizingElement.style.zIndex = "10"; resizingElement = null;
                }
                if (draggedElement) {
                    const rId = draggedElement.id.replace('note-', ''), r = allRecords.find(x => x.id === rId);
                    if (r) {
                        try {
                            const updates = { x: parseFloat(draggedElement.style.left), y: parseFloat(draggedElement.style.top) };
                            const batch = writeBatch(db);

                            if (r.type === "improvement" && isDraggedImproveDisconnected && !tempConnectionInterpId) {
                                updates.connectedInterpId = null;
                                showToast("解釈とのつながりを解除しました", "info");
                            }
                            if (r.type === "interpretation" && isDraggedInterpDisconnected && !tempConnectionFactId) {
                                updates.connectedFactId = null;
                                showToast("事実とのつながりを解除しました", "info");
                            }

                            if (r.type === "improvement" && tempConnectionInterpId) {
                                updates.connectedInterpId = tempConnectionInterpId;
                                showToast("解釈と結びつけました", "success");
                            }
                            if (r.type === "interpretation") {
                                if (tempConnectionFactId) {
                                    updates.connectedFactId = tempConnectionFactId;
                                    showToast("事実と結びつけました", "success");
                                }
                                if (tempConnectionImproveId) {
                                    batch.update(doc(recordsCol, tempConnectionImproveId), { connectedInterpId: r.id });
                                    showToast("改善案と結びつけました", "success");
                                }
                            }

                            batch.update(doc(recordsCol, r.id), updates);
                            batch.update(doc(workspacesCol, currentWorkspaceId), { updatedAt: new Date().toISOString() });
                            await batch.commit();
                        } catch (err) {
                            showToast("位置の同期に失敗しました", "error");
                        }
                    }
                    draggedElement.style.zIndex = "10"; draggedElement = null;
                    
                    tempConnectionFactId = null; tempConnectionInterpId = null; tempConnectionImproveId = null;
                    isDraggedInterpDisconnected = false; isDraggedImproveDisconnected = false;
                }
            };
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', end); document.addEventListener('touchmove', move, { passive: false }); document.addEventListener('touchend', end);
            window.addEventListener('resize', adjustNotesOnResize);
        }

        async function alignStickyNotes() {

            const b = document.getElementById("boardContainer"), notes = Array.from(b.querySelectorAll('.sticky-note')); if (!notes.length) return;
            let cols = b.offsetWidth < 640 ? 1 : b.offsetWidth < 1024 ? 2 : 4;

            try {

        // --- Connection Drawing ---
        function drawConnections() {
            const svg = document.getElementById("connectorSvg"); if (!svg) return; svg.innerHTML = "";
            const bR = document.getElementById("boardContainer").getBoundingClientRect();
            const workspaceRecords = allRecords.filter(r => r.workspaceId === currentWorkspaceId);

                        drawSingleLine(svg, r, f, bR, isDisconnected ? "#ef4444" : "#f59e0b", isDisconnected);
                    }
                }
                if (r.type === "improvement" && r.connectedInterpId) {
                    const i = workspaceRecords.find(x => x.id === r.connectedInterpId);
                    if (i) {
                        const isDisconnected = (draggedElement && draggedElement.id === `note-${r.id}` && isDraggedImproveDisconnected);
                        drawSingleLine(svg, r, i, bR, isDisconnected ? "#ef4444" : "#10b981", isDisconnected);
                    }
                }
            });
            if (draggedElement) {
                const r = workspaceRecords.find(x => x.id === draggedElement.id.replace('note-', ''));

                    if (tempConnectionFactId) { const t = workspaceRecords.find(x => x.id === tempConnectionFactId); if (t) drawSingleLine(svg, r, t, bR, "#f59e0b", true); }
                    if (tempConnectionImproveId) { const t = workspaceRecords.find(x => x.id === tempConnectionImproveId); if (t) drawSingleLine(svg, r, t, bR, "#10b981", true); }
                    if (tempConnectionInterpId && r.type === "improvement") { const t = workspaceRecords.find(x => x.id === tempConnectionInterpId); if (t) drawSingleLine(svg, r, t, bR, "#10b981", true); }
                }

        }

        }

        function setDrawingMode(m) {
            opMode = m; const el = document.getElementById("drawingCanvas");
            ['select', 'pen', 'eraser'].forEach(x => document.getElementById(`btn-mode-${x}`).className = `w-10 h-10 rounded-xl transition-all ${m === x ? (x === 'select' ? 'bg-indigo-50 text-indigo-600 shadow-sm' : x === 'pen' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-700 text-white shadow-md') : 'text-slate-400 hover:bg-slate-100'}`);
            const o = document.getElementById("drawingOptions"); if (m === 'select') o.classList.replace("flex", "hidden"); else o.classList.replace("hidden", "flex");
            document.getElementById("colorPaletteContainer").className = m === 'pen' ? "flex flex-col gap-1.5 items-center border-b pb-2.5" : "hidden";
            document.getElementById("width-tool-label").innerText = m === 'pen' ? "太さ" : "消し幅";
            if (m === 'select') { el.classList.remove("prevent-pan"); el.style.pointerEvents = "none"; document.querySelectorAll('.sticky-note').forEach(n => n.style.cursor = "grab"); }
            else { el.classList.add("prevent-pan"); el.style.pointerEvents = "auto"; document.querySelectorAll('.sticky-note').forEach(n => n.style.cursor = "default"); } redrawDrawings();
        }
        function setPenColor(c) { penColor = c; ['#1e293b', '#ef4444', '#0ea5e9', '#10b981'].forEach(x => document.getElementById(`color-${x}`).className = `w-6 h-6 rounded-full border-2 ${x === c ? 'border-indigo-600 scale-110' : 'border-transparent hover:scale-105'} ${x === '#1e293b' ? 'bg-slate-800' : x === '#ef4444' ? 'bg-red-500' : x === '#0ea5e9' ? 'bg-sky-500' : 'bg-emerald-500'}`); }
        function setPenWidth(w) { penWidth = w; [3, 6, 12].forEach(x => document.getElementById(`width-${x}`).className = `w-8 h-8 rounded-lg font-bold text-[10px] ${x === w ? 'bg-slate-800 text-white' : 'text-slate-500 hover:bg-slate-50'}`); }
        
        function getCanvasCoords(e) { const r = dCanvas.getBoundingClientRect(), cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX, cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY; return { pxX: cx - r.left, pxY: cy - r.top, pctX: ((cx - r.left) / r.width) * 100, pctY: ((cy - r.top) / r.height) * 100 }; }
        function onDrawStart(e) { if (opMode === 'select') return; isDrawing = true; const c = getCanvasCoords(e); if (!c) return; if (opMode === 'eraser') { lastEraserCoords = c; eraseStrokeAt(c); } else currentStrokePoints = [{ x: c.pctX, y: c.pctY }]; if (e.type.includes('touch')) e.preventDefault(); }
        function onDrawMove(e) { if (!isDrawing || opMode === 'select') return; const c = getCanvasCoords(e); if (!c) return; if (opMode === 'eraser') { lastEraserCoords = c; eraseStrokeAt(c); } else { const lp = currentStrokePoints[currentStrokePoints.length - 1]; currentStrokePoints.push({ x: c.pctX, y: c.pctY }); const r = dCanvas.getBoundingClientRect(); dCtx.beginPath(); dCtx.strokeStyle = penColor; dCtx.lineWidth = penWidth; dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.moveTo((lp.x / 100) * r.width, (lp.y / 100) * r.height); dCtx.lineTo((c.pctX / 100) * r.width, (c.pctY / 100) * r.height); dCtx.stroke(); } if (e.type.includes('touch')) e.preventDefault(); }
        
        async function onDrawEnd() {
            if (!isDrawing) return; isDrawing = false;
            if (opMode !== 'eraser' && currentStrokePoints.length) {
                const newDrawingId = "draw-" + Date.now() + "-" + Math.random().toString(36).substr(2, 9);
                const newDrawing = { 
                    id: newDrawingId,
                    workspaceId: currentWorkspaceId, 
                    mode: opMode, 
                    color: penColor, 
                    width: penWidth, 
                    points: currentStrokePoints, 
                    createdAt: new Date().toISOString() 
                };
                
                // Firestoreからのリアルタイム同期を待つ間、フリッカーを防ぐ
                localDrawings.push(newDrawing);
                redrawDrawings();

                if (user && currentWorkspaceId) {
                    try {
                        await setDoc(doc(drawingsCol, newDrawingId), newDrawing);
                    } catch (err) { 
                        console.warn("Firestoreへの手書き保存に失敗しましたが、ローカルバッファで描画を維持します。");
                    }
                }
            }
            currentStrokePoints = []; lastEraserCoords = null; redrawDrawings();
        }

        async function eraseStrokeAt(c) {
            if (!currentWorkspaceId) return;
            // リアルタイム同期データ & ローカルの未同期バッファの両方をマージして消去判定
            const combinedDrawings = [...allDrawings, ...localDrawings].filter(d => d.workspaceId === currentWorkspaceId);
            if (!combinedDrawings.length) { redrawDrawings(); return; }

            const r = dCanvas.getBoundingClientRect(), hitRadPct = ((penWidth / 2 + 15) / ((r.width + r.height) / 2)) * 100, tSq = hitRadPct * hitRadPct;
            let hitId = null;
            
            for (let i = combinedDrawings.length - 1; i >= 0; i--) {
                const pts = combinedDrawings[i].points; if (!pts) continue;
                let isHit = false;
                for (let j = 0; j < pts.length; j++) {
                    const dSq = j === 0 ? (c.pctX - pts[0].x) ** 2 + (c.pctY - pts[0].y) ** 2 : (() => {
                        const dx = pts[j].x - pts[j - 1].x, dy = pts[j].y - pts[j - 1].y;
                        if (dx === 0 && dy === 0) return (c.pctX - pts[j - 1].x) ** 2 + (c.pctY - pts[j - 1].y) ** 2;
                        let t = ((c.pctX - pts[j - 1].x) * dx + (c.pctY - pts[j - 1].y) * dy) / (dx * dx + dy * dy);
                        return t < 0 ? (c.pctX - pts[j - 1].x) ** 2 + (c.pctY - pts[j - 1].y) ** 2 : t > 1 ? (c.pctX - pts[j].x) ** 2 + (c.pctY - pts[j].y) ** 2 : (c.pctX - (pts[j - 1].x + t * dx)) ** 2 + (c.pctY - (pts[j - 1].y + t * dy)) ** 2;
                    })();
                    if (dSq <= tSq) { isHit = true; break; }
                }
                if (isHit) { hitId = combinedDrawings[i].id; break; }
            }
            if (hitId) { 
                // 遅延なく即座にローカル配列から除外して消し去る
                allDrawings = allDrawings.filter(d => d.id !== hitId);
                localDrawings = localDrawings.filter(d => d.id !== hitId);
                redrawDrawings();
                
                if (user) {
                    try { 
                        await deleteDoc(doc(drawingsCol, hitId)); 
                    } catch (err) { 
                        console.warn("Firestoreからの削除に失敗しました。");
                    } 
                }
            }
            redrawDrawings();
        }

        function redrawDrawings() {
            if (!dCanvas || !dCtx) return; const r = dCanvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; if (r.width === 0) return;
            dCanvas.width = r.width * dpr; dCanvas.height = r.height * dpr; dCtx.scale(dpr, dpr); dCtx.clearRect(0, 0, r.width, r.height);
            
            const workspaceDrawings = allDrawings.filter(d => d.workspaceId === currentWorkspaceId);
            const combinedDrawings = [...workspaceDrawings];
            localDrawings.forEach(ld => {
                if (ld.workspaceId === currentWorkspaceId && !combinedDrawings.some(d => d.id === ld.id)) {
                    combinedDrawings.push(ld);
                }
            });

            if (combinedDrawings.length) {
                combinedDrawings.forEach(s => {
                    if (!s.points || !s.points.length) return; dCtx.beginPath(); dCtx.strokeStyle = s.color || '#1e293b'; dCtx.lineWidth = s.width || 6; dCtx.lineCap = 'round'; dCtx.lineJoin = 'round';
                    dCtx.moveTo((s.points[0].x / 100) * r.width, (s.points[0].y / 100) * r.height);
                    for (let i = 1; i < s.points.length; i++) dCtx.lineTo((s.points[i].x / 100) * r.width, (s.points[i].y / 100) * r.height);
                    dCtx.stroke();
                });
            }
            if (isDrawing && opMode === 'eraser' && lastEraserCoords) { dCtx.beginPath(); dCtx.fillStyle = 'rgba(239,68,68,0.15)'; dCtx.strokeStyle = 'rgba(239,68,68,0.4)'; dCtx.lineWidth = 1.5; dCtx.arc((lastEraserCoords.pctX / 100) * r.width, (lastEraserCoords.pctY / 100) * r.height, penWidth/2+15, 0, Math.PI * 2); dCtx.fill(); dCtx.stroke(); }
        }

        async function undoLastStroke() {
            if (!currentWorkspaceId) return;
            const combinedDrawings = [...allDrawings, ...localDrawings].filter(d => d.workspaceId === currentWorkspaceId);
            combinedDrawings.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
            if (combinedDrawings.length) {
                const targetId = combinedDrawings[combinedDrawings.length - 1].id;
                
                allDrawings = allDrawings.filter(d => d.id !== targetId);
                localDrawings = localDrawings.filter(d => d.id !== targetId);
                redrawDrawings();
                
                if (user) {
                    try {
                        await deleteDoc(doc(drawingsCol, targetId));
                        showToast("手書きを1つ取り消しました", "info");
                    } catch (err) { showToast("取り消しに失敗しました", "error"); }
                } else {
                    showToast("手書きを1つ取り消しました", "info");
                }
            } else { showToast("取り消す描画がありません", "error"); }
        }

        async function clearDrawingsWithConfirm() {
            if (!currentWorkspaceId) return;
            const combinedDrawings = [...allDrawings, ...localDrawings].filter(d => d.workspaceId === currentWorkspaceId);
            if (combinedDrawings.length) {
                if (await openDialog({ type: 'confirm', title: '消去', message: 'ボード上のすべての手書き線のみを完全に消去しますか？\n（付箋データは消去されません）', danger: true })) {
                    allDrawings = allDrawings.filter(d => d.workspaceId !== currentWorkspaceId);
                    localDrawings = localDrawings.filter(d => d.workspaceId !== currentWorkspaceId);
                    redrawDrawings();
                    
                    if (user) {
                        try {
                            const batch = writeBatch(db);
                            combinedDrawings.forEach(d => batch.delete(doc(drawingsCol, d.id)));
                            await batch.commit();
                            showToast("手書き線をすべて消去しました");
                        } catch (err) { showToast("消去に失敗しました", "error"); }
                    } else {
                        showToast("手書き線をすべて消去しました");
                    }
                }
            }
        }

        // 3点リーダーメニュー制御
        function setupFloatingMenuDelay() {
            const t = document.getElementById("fullscreenMenu"), p = document.getElementById("fullscreenMenuPanel");
            
            t.onmouseenter = () => { clearTimeout(menuDelayTimer); p.classList.add("menu-panel-active"); }; 
            t.onmouseleave = () => { menuDelayTimer = setTimeout(() => p.classList.remove("menu-panel-active"), 800); };
            
            const closePanelHandler = (e) => { 
                if (!t.contains(e.target)) p.classList.remove("menu-panel-active"); 
            };
            document.addEventListener('click', closePanelHandler);
            document.addEventListener('touchstart', closePanelHandler);

            const toggleHandler = (e) => {
                if (e.target.closest('#fullscreenMenuBtn')) { 
                    p.classList.toggle("menu-panel-active"); 
                    e.stopPropagation(); 
                    e.preventDefault();
                }
            };
            t.addEventListener('click', toggleHandler);
            t.addEventListener('touchstart', toggleHandler, { passive: false });

            t.onmousedown = (e) => e.stopPropagation();
            t.ontouchstart = (e) => e.stopPropagation();
        }

        // --- Global Drag Logic Helper (Needed to handle coordinate translation) ---
        function startDrag(e, id) {
            if (opMode !== 'select') return;
            const el = document.getElementById(id); if (!el) return;
            draggedElement = el;
            const bR = document.getElementById("boardContainer").getBoundingClientRect();
            const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            dragOffsetX = cx - el.getBoundingClientRect().left;
            dragOffsetY = cy - el.getBoundingClientRect().top;
            el.style.zIndex = "100";

            isDraggedInterpDisconnected = false;
            isDraggedImproveDisconnected = false;
            tempConnectionFactId = null;
            tempConnectionInterpId = null;
            tempConnectionImproveId = null;

            e.stopPropagation();
        }

        function startResize(e, id) {
            const el = document.getElementById(id); if (!el) return;
            resizingElement = el;
            resizeStartWidth = el.offsetWidth;
            resizeStartHeight = el.offsetHeight;
            resizeStartX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            resizeStartY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            el.style.zIndex = "100";
            e.stopPropagation();
            e.preventDefault();
        }

        // --- Global Bindings for HTML ---
        window.createNewWorkspace = createNewWorkspace;
        window.renameWorkspace = renameWorkspace;
        window.renameCurrentWorkspace = renameCurrentWorkspace;
        window.deleteWorkspace = deleteWorkspace;
        window.openBoard = openBoard;
        window.goBackToHome = goBackToHome;
        window.openNoteModal = openNoteModal;
        window.closeNoteModal = closeNoteModal;
        window.handleNoteSubmit = handleNoteSubmit;
        window.deleteRecordWithConfirm = deleteRecordWithConfirm;
        window.disconnectRecordDirectly = disconnectRecordDirectly;
        window.toggleFullscreen = toggleFullscreen;
        window.disableFullscreenAPI = disableFullscreenAPI;
        window.toggleSearchInput = toggleSearchInput;
        window.applyFilters = applyFilters;
        window.alignStickyNotes = alignStickyNotes;
        window.exportBoardPDF = exportBoardPDF;
        window.exportCSV = exportCSV;
        window.openBackupModal = openBackupModal;
        window.closeBackupModal = closeBackupModal;
        window.exportDataJSON = exportDataJSON;
        window.importDataJSON = importDataJSON;
        window.setDrawingMode = setDrawingMode;
        window.setPenColor = setPenColor;
        window.setPenWidth = setPenWidth;
        window.undoLastStroke = undoLastStroke;
        window.clearDrawingsWithConfirm = clearDrawingsWithConfirm;
        window.startDrag = startDrag;
        window.startResize = startResize;

        // --- Startup Initialization ---
        loadAllData();
        renderHomeScreen();
        setupGlobalDragListeners();
        setupFloatingMenuDelay();
    </script>
